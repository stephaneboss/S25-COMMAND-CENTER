name = "merlin-s25-proxy"
main = "src/index.js"
compatibility_date = "2026-03-11"
workers_dev = true
routes = [
  { pattern = "merlin.smajor.org", custom_domain = true }
  ]

  [vars]
  # wrangler n'interpole PAS ${...} ici - les placeholders precedents etaient
  # deployes comme chaines litterales et faisaient planter new URL() dans
  # src/index.js l.88. Valeurs alignees sur smajor-hub et trinity-worker.
  ORIGIN_BASE = "https://cockpit-alien.smajor.org"
  ORIGIN_HOST_HEADER = "cockpit-alien.smajor.org"
  PROXY_TIMEOUT_MS = "30000"
  PROXY_RETRIES = "0"
